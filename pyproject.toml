[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civsim-harness"
version = "0.1.0"
description = "Unattended Civilization VI playing harness (CivSim deliverable 2)."
requires-python = ">=3.12"

# Portable core only. Platform-specific libraries live exclusively in the
# per-platform extras below (research R19) -- a macOS or Linux install must
# never pull pywin32, and a Windows install must never pull pyobjc or Xlib.
dependencies = [
  "pydantic>=2",
  "httpx",
  "psutil",
  "typer",
  "fastapi",
  "uvicorn",
  "SQLAlchemy",
  "Pillow",
  "PyYAML",
]

[project.scripts]
civsim = "civsim_harness.operator.cli:app"
civsim-web = "civsim_web.cli:main"

# Per-platform host adapters (src/civsim_harness/host/{windows,macos,linux}/).
# Each dependency also carries its own `sys_platform` marker as a second line
# of defence: even if the wrong extra is requested on the wrong host, the
# marker keeps the resolver from trying to install an unusable wheel there.
[project.optional-dependencies]
windows = [
  "pywin32>=306; sys_platform == 'win32'",
  "winsdk>=1.0.0b10; sys_platform == 'win32'",
  "pydirectinput>=1.0.4; sys_platform == 'win32'",
]
macos = [
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]
linux = [
  "python-xlib>=0.33; sys_platform == 'linux'",
  "dbus-python>=1.3.2; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "syrupy>=4",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-timeout>=2.4.0",
]

# Deliverable 1 -- the unified web interface (specs/001-unified-web-interface,
# src/civsim_web/). Declared as its own group, additively, so a harness-only
# install never pulls a template engine it has no use for, and so this file's
# civsim_harness declarations above stay untouched (tasks.md T002).
civsim_web = [
  "fastapi",
  "uvicorn",
  "jinja2",
  "pydantic>=2",
  "PyYAML",          # the Panel Registry is YAML (contracts/panel-registry.md)
  "httpx",           # test-only: FastAPI's ASGI test transport
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "syrupy>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/civsim_harness", "src/civsim_web"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------

[tool.ruff]
extend-exclude = ["specs/**/spikes/**"]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["civsim_harness", "civsim_web"]

# The portable core must run unchanged on every target platform (research
# R19); host/ is the one directory permitted to speak to an OS directly
# (plan.md Structure Decision). This is "is the harness platform-neutral?"
# made answerable from the import graph instead of a code review.
[tool.ruff.lint.per-file-ignores]
"src/civsim_harness/host/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pywin32".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32api".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32con".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32gui".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32com".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32comext".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32event".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32file".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32pipe".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32process".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32security".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32clipboard".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32service".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32serviceutil".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"win32ui".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"pywintypes".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"pythoncom".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"winerror".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"winsdk".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"pydirectinput".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"Quartz".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"AppKit".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"Xlib".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."
"ctypes.windll".msg = "OS-specific imports are only permitted in src/civsim_harness/host/ (research R19)."

# --------------------------------------------------------------------------
# mypy -- strict on the portable core (src/civsim_harness); tests are looser
# --------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "civsim_harness.*"
strict = true

# --------------------------------------------------------------------------
# pytest -- four tiers (unit, contract, integration, live); only the first
# three run by default / in CI (plan.md Testing). `live` needs a real Civ VI
# client and is excluded from the default run via addopts, not deleted from
# discovery, so `pytest tests/live -m live` still works explicitly.
#
# 2026-09-22: that directory rule was the ONLY thing standing between a default
# `pytest` run and the operator's real client, and a directory is not a
# declaration. `tests/live/` was excluded by path; everything else was assumed
# safe because of where it lived. It was not: `tests/contract/
# test_host_platform_port.py` builds the real Linux adapter and calls
# `send_input([enter])` on it (XTEST injects that keypress into whatever window
# currently has focus), and `tests/unit/test_operator_api.py`'s CLI `doctor`
# test connects a default `NexusClient` to the FireTuner's default endpoint and
# scans for the real client process. Both sat in the default run. The `client`
# marker below replaces "infer it from the path" with "say so", and the
# exclusion is in `addopts` for the same reason `--ignore=tests/live` is:
# excluded from the default run, never deleted from discovery.
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `-m "not client"` is UNCONDITIONAL and must stay that way. The tempting
# inversion -- skip when the client is absent -- means the test RUNS when the
# client is PRESENT, which is precisely the machine where running it costs
# somebody a live game board. Absence of the client is not what makes these
# tests unsafe; presence of it is.
addopts = ["--ignore=tests/live", "-m", "not client"]
# A hung test must name itself. 2026-09-21: the suite stopped at ~40% twice with no output at
# all, and finding out which test it was took a hand-passed `-o faulthandler_timeout=...`. Both
# of these are defaults now, so the next one says so by itself:
#   faulthandler_timeout -- dump every thread's stack after 120 s of one test, then keep going,
#                           which is what actually named run_turn_cycle's unbounded replay loop.
#   timeout              -- pytest-timeout turns a test still running after 10 minutes into a
#                           named FAILURE instead of an endless run. `thread` (not `signal`) is
#                           required here: the suite is asyncio-heavy and a signal-based timeout
#                           cannot interrupt a coroutine blocked inside the event loop.
faulthandler_timeout = 120
timeout = 600
timeout_method = "thread"
markers = [
  "live: exercises a real Civilization VI client; excluded from the default run (see plan.md Testing)",
  # `client` is the declaration `--ignore=tests/live` could only imply. Mark a test
  # with it when the test, on SOME supported host, can reach the operator's real
  # machine state rather than a fake:
  #   * opens a tuner connection to a default/real endpoint (not a FakeNexusServer's
  #     own ephemeral port),
  #   * resolves a real game window, or captures from one,
  #   * scans for / locates the real Civilization VI process,
  #   * sends synthetic input to the real display server, or
  #   * takes a run-identity lock outside a `tmp_path` lock directory.
  # It is deliberately NOT conditional on the client being present: see the
  # addopts note above. A wrongly-marked safe test costs a little coverage; a
  # wrongly-unmarked unsafe one costs another lane its game board.
  # To run them DELIBERATELY, on a machine that owns the client:
  #     uv run pytest -m client            # just these
  #     uv run pytest -m "client or not client"   # the whole default tree plus these
  "client: reaches the real Civilization VI client, FireTuner, display server or run lock; excluded from the default run by addopts (-m 'not client'). Run deliberately with `pytest -m client` on a machine that owns the client",
]
