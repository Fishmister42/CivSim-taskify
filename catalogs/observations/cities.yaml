# catalogs/observations/cities.yaml
# Backed by lua/gamecore/cities.lua (capability_id: cities.read). Also the source of the `city.*`
# predicate symbols (catalogs/README.md §4) used by catalogs/actions/cities.yaml.

- declaration_id: cities.state
  kind: observation
  summary: >
    Every city the local player owns (full detail), plus other civilizations' cities currently
    visible on a revealed and visible plot (name, owner, population only).
  parity_basis: >
    Look at city banners on the map and open a city's production/purchase panel for full detail
    on an owned city.
  context: GameCore_Tuner
  capability_id: cities.read
  output_schema:
    type: object
    required: [cities]
    properties:
      cities:
        type: array
        items:
          type: object
          required: [city_id, name, owner_player_id, owner_is_local_player, plot, population]
          properties:
            city_id: { type: integer }
            name: { type: string }
            owner_player_id: { type: integer }
            owner_is_local_player: { type: boolean }
            plot:
              type: object
              required: [x, y]
              properties: { x: { type: integer }, y: { type: integer } }
            population: { type: number }
            production_queue:
              type: array
              items: { type: string }
            available_productions:
              type: array
              items: { type: string }
            gold_available: { type: number }
            can_buy_with_gold: { type: boolean }
            can_buy_with_faith: { type: boolean }
            purchasable_with_gold:
              type: array
              items: { type: string }
            purchasable_with_faith:
              type: array
              items: { type: string }
  introduced_in_version: "2026.09.1"

# T255 (2026-09-21). The InGame half of city selection: cities.state above lists the cities from
# GameCore_Tuner, where `UI` does not exist, so it cannot say which one the human has selected --
# and every city order's availability predicate starts `city.is_selected and ...`. This
# declaration reports the game's head-selected city (`UI.GetHeadSelectedCity()`, the city whose
# panel is open); act/predicates.py overlays it onto the bound `city` namespace, so the two
# bodies stay where each is verified to work. Unit selection is reported inside units.state
# itself because that body already runs InGame.
- declaration_id: cities.selection
  kind: observation
  summary: >
    Which city, if any, the player currently has selected (the city whose panel is open).
  parity_basis: >
    Look at which city's panel is open on screen — the city the player clicked. Nothing about
    the city's contents is read here; that is cities.state's job.
  context: InGame
  capability_id: cities.selection
  output_schema:
    type: object
    required: [has_selection]
    properties:
      has_selection: { type: boolean }
      selected_city_id: { type: integer }
      owner_player_id: { type: integer }
      owner_is_local_player: { type: boolean }
      reason: { type: string }
  introduced_in_version: "2026.09.3"
