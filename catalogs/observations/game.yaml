# catalogs/observations/game.yaml
# Backed by lua/ingame/screens.lua (capability_id: screens.probe) and lua/ingame/turn_control.lua
# (capability_id: turn.control).
#
# Not named in tasks.md T090's literal file list. Added because lua/ingame/screens.lua (T088) and
# the `game.*` predicate symbols this catalog's own README defines (used by turn.end_turn's
# availability_predicate and by every prompt-response action's availability check) need a
# resolving observation declaration; without one, `game.has_blocking_prompt` and
# `game.current_screen` would be predicate symbols with no declared source, which the loader
# cannot accept as a parity boundary. Added as a necessary, narrowly scoped completion of T090's
# intent, called out in the authoring report.

- declaration_id: game.screen_state
  kind: observation
  summary: >
    Which screen or panel is currently open, and whether a blocking prompt requiring a decision
    is up.
  parity_basis: >
    Look at whichever screen or panel is currently open on the local player's own display —
    obvious to any human player observing their own screen.
  # CORRECTED against a live client (specs/002-civ-playing-harness/spikes/lua-api-verification-linux.md,
  # P2): there is no single-call UIManager screen-identity API (GetScreen/GetTopmostScreen/
  # GetCurrentPopup/IsScreenOpen/GetScreenName are all confirmed nil). The verified mechanism is
  # per-screen `ContextPtr:IsHidden()` — each UI screen is its own isolated Lua state — proven live
  # by flipping InGameTopOptionsMenu via Escape and observing exactly it change (screen_identity.md).
  # FR-010/FR-049 ARE reachable through FireTuner; there is no firetuner_gap here. See
  # lua/ingame/screens.lua's header for the full correction and CIVSIM_SCREEN_WATCHLIST there.
  #
  # REPORTED, NOT FIXED (Python-side implication, outside this agent's lua/+catalogs ownership):
  # assembling this declaration's shape now requires the dispatcher to resolve each watchlisted
  # screen name to its own Lua state (via the nexus protocol's `LSQ:` handshake) and issue one
  # CivSim_Screens.probe() command per candidate screen, folding the per-screen `hidden` results
  # into `screen`/`recognized`/`has_blocking_prompt` below — rather than one call into `InGame`
  # answering this whole shape by itself, which was this declaration's previous assumption. Z-order
  # is not exposed by this mechanism, so "screen" below can report which known screen is open, not
  # which is topmost if more than one somehow reports open at once.
  context: InGame
  capability_id: screens.probe
  output_schema:
    type: object
    required: [screen, recognized, has_blocking_prompt]
    properties:
      screen: { type: string }
      raw_screen_id: { type: string }
      recognized: { type: boolean }
      has_blocking_prompt: { type: boolean }
      prompt_options:
        type: array
        items: { type: string }
      # 2026.09.8. A prompt that asks for a FIXED NUMBER of picks rather than one answer needs
      # that number reported, or the agent cannot tell a half-made choice from a finished one.
      # Only the era dedication chooser reports these today (lua/ingame/screens.lua,
      # `prompt.era_dedication`): the chooser's Confirm button stays greyed out until exactly
      # `prompt_selections_allowed` of its cards are ticked, which is what a human reads off the
      # screen, so the same three facts are reported here rather than left implicit.
      # `prompt_selections_allowed` is absent when the client could not answer it, in which case
      # the Confirm button's own enabled state -- what the human actually goes by -- still
      # governs. Every other prompt family omits all three.
      prompt_selections_allowed: { type: integer, minimum: 0 }
      prompt_selections_made: { type: integer, minimum: 0 }
      prompt_selected_options:
        type: array
        items: { type: string }
      # 2026.09.20. THE FALL-THROUGH'S EVIDENCE. `recognized: true` used to mean two different
      # things: "I identified what is on screen" and "nothing on my hand-maintained watchlist is
      # open". Three production instances took the second meaning and reported the first --
      # `WorldCongressIntro` (turn 57), `EndGameMenu` (a full-screen DEFEAT modal, turn 67) and
      # `HistoricMoments` (the "Era Makes History" card) -- so the probe answered `screen: world`,
      # `recognized: true`, `has_blocking_prompt: false` with a modal demonstrably up, and actions
      # were dispatched into it. The probe now reads the engine's own popup stack
      # (`UIManager:GetPopupStack`, base/assets/ui/utilities/tunerutilities.lua:187) before
      # consulting any list of ours, and these two fields are the evidence the `world` answer
      # rests on. `popup_stack_depth` is absent exactly when the stack could not be read at all --
      # in which case `recognized` is false and `screen_probe_reason` says why, because absence
      # and unobservability must not share a representation.
      #
      # `screen_probe_reason` is present only when the probe could NOT identify the board, and it
      # names which of the branches fired: `popup_stack_unreadable` (the accessor is not
      # available), `popup_stack_entry_unnamed` (a popup is up carrying no id at all),
      # `popup_stack_id_unresolvable` / `popup_stack_id_unreadable` (an id the probe cannot look
      # up or whose visibility it cannot read), `unnamed_popup_showing` (a popup demonstrably on
      # screen that no catalog id names) or `watched_state_has_no_catalog_id`.
      #
      # Parity: `popup_stack_ids` names the screens currently stacked on the local player's own
      # display -- what a human sees by looking at their screen. Nothing here reads a popup's
      # private state.
      screen_probe_reason: { type: string }
      screen_probe_error: { type: string }
      # 2026.09.22. The generic in-game dialog (`InGamePopup`) is ONE context for every
      # `PopupDialogInGame` in the game, and that channel carries both one-button reports and
      # two-button decisions (`popupdialog.lua:514-576`). The probe names it `prompt.generic_popup`
      # only when the dialog's own button row holds exactly one button; any other count is reported
      # `unknown` with `screen_probe_reason` `generic_popup_offers_a_choice` or
      # `generic_popup_offers_no_button`, and these two fields are what that stall saw. Present
      # only on those branches. `popup_button_labels` are the labels a human reads on the buttons,
      # and they are reported so an operator can see WHICH decision the harness declined to answer
      # -- never so anything acts on them.
      popup_button_count: { type: integer, minimum: 0 }
      popup_button_labels:
        type: array
        items: { type: string }
      popup_stack_depth: { type: integer, minimum: 0 }
      popup_stack_ids:
        type: array
        items: { type: string }
  introduced_in_version: "2026.09.1"

- declaration_id: game.turn_state
  kind: observation
  summary: >
    The current turn number and whose turn it is.
  parity_basis: >
    Look at the turn counter in the top bar and whether the end-turn button is enabled (it is
    only enabled during the local player's own turn).
  # VERIFIED (specs/002-civ-playing-harness/spikes/lua-api-verification-linux.md, P1):
  # is_local_player_turn is backed by `UI.CanEndTurn()` in lua/ingame/turn_control.lua, a real
  # boolean confirmed readable before acting — not the earlier untested
  # `Players[x]:IsTurnActive()` guess, which has been removed. turn_number is
  # `Game.GetCurrentGameTurn()`, also confirmed. This is the readback that turn.end_turn's
  # verification_predicate (catalogs/actions/turn.yaml) depends on to detect a swallowed end-turn,
  # since `UI.RequestAction(ActionTypes.ACTION_ENDTURN)` — the confirmed real end-turn call —
  # always returns `nil`.
  context: InGame
  capability_id: turn.control
  output_schema:
    type: object
    required: [turn_number, is_local_player_turn, is_waiting_for_other_players]
    properties:
      turn_number: { type: integer, minimum: 1 }
      is_local_player_turn: { type: boolean }
      is_waiting_for_other_players: { type: boolean }
  introduced_in_version: "2026.09.1"

- declaration_id: game.outcome_state
  kind: observation
  summary: >
    Whether the game has ended, and whether it ended in this player's own victory or defeat.
  parity_basis: >
    Look at your own victory or defeat screen — the game shows the local player, and only the
    local player, whether their own game has been won or lost the moment it ends.
  # T216. Added because run/composition.py's `_evaluate_stop_facts` had nothing to resolve FR-005's
  # `game_outcome` stop condition from: no declaration in this catalog read the game's own outcome,
  # so a run configured to play to a victory or defeat could never stop. Scoped deliberately
  # narrowly — see lua/gamecore/game_outcome.lua's own header for the full parity note, and in
  # particular for why `Game.GetVictoryProgressForTeam` (one call away from what this reads) is
  # named there as forbidden rather than merely unused: another team's progress toward victory is
  # hidden opponent state, and this declaration must never be widened to include it.
  #
  # `outcome` is this player's own result only. It never names which other civilization won, nor
  # by which victory type — "defeat" is all a losing local player's own screen establishes here.
  #
  # VERIFIED that the backing calls exist: the R5/T077 live namespace enumeration
  # (spikes/r5-raw/GameCore_Tuner__namespaces.txt) lists Game.GetWinningTeam, Game.GetLocalPlayer,
  # and Game.GetCurrentGameTurn as real functions in this context. The per-player accessors
  # (GetTeam/IsAlive) remain UNVERIFIED and are pcall-guarded individually in the Lua, degrading to
  # "unresolved" rather than to a fabricated outcome.
  context: GameCore_Tuner
  capability_id: game.outcome
  output_schema:
    type: object
    required: [is_game_over, outcome]
    properties:
      is_game_over: { type: boolean }
      # "victory" | "defeat" | "none" (game still running) | "unresolved" (no local player, or
      # the outcome could not be read at all). Never a team id and never a victory type.
      outcome: { type: string }
  introduced_in_version: "2026.09.2"
