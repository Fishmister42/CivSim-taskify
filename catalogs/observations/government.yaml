# catalogs/observations/government.yaml
# Backed by lua/gamecore/government.lua (capability_id: government.read).

- declaration_id: government.state
  kind: observation
  summary: >
    The local player's own current government, currently slottable policy cards, and governor
    assignments.
  parity_basis: >
    Open the Government screen and look at the current government, the policy card slots, and
    the governors panel.
  context: GameCore_Tuner
  capability_id: government.read
  output_schema:
    type: object
    required: [available_governments, available_policies, governors, available_governors]  # current_government nullable: no government before Code of Laws (measured turn 1, T213)
    properties:
      current_government: { type: [string, "null"] }
      available_governments:
        type: array
        items: { type: string }
      # Present only when the list could not be read at all -- never a silent `[]`. See
      # lua/gamecore/government.lua and the 2026-09-21 accessor audit: the three phantom accessors
      # this observation used (GetSlottablePolicies, HasGovernment, governorList.Members /
      # GetAssignedCityID) each reported an honest-looking empty list forever.
      available_governments_reason: { type: string }
      available_policies:
        type: array
        items: { type: string }
      available_policies_reason: { type: string }
      governors:
        type: array
        items:
          type: object
          properties:
            governor_type: { type: [string, "null"] }
            assigned_city_id: { type: [integer, "null"] }
      governors_reason: { type: string }
      available_governors:
        type: array
        items: { type: string }
  introduced_in_version: "2026.09.1"
