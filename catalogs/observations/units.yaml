# catalogs/observations/units.yaml
# Backed by lua/gamecore/units.lua (capability_id: units.read). Also the source of the `unit.*`
# predicate symbols (catalogs/README.md §4) used by catalogs/actions/units.yaml.

- declaration_id: units.state
  kind: observation
  summary: >
    Every unit the local player owns, plus other civilizations' units currently visible on a
    revealed and visible plot.
  parity_basis: >
    Look at unit flags on the map and the unit panel for a selected unit; movement range,
    available promotions and the build buttons offered on the tile it is standing on are exactly
    what that panel shows.
  context: InGame  # T213 (2026-09-21, measured): GetUnitType, GetReachableMovement, CanStartOperation exist InGame only
  capability_id: units.read
  output_schema:
    type: object
    required: [units]
    properties:
      units:
        type: array
        items:
          type: object
          required: [unit_id, unit_type, owner_player_id, owner_is_local_player, plot]
          properties:
            unit_id: { type: integer }
            unit_type: { type: string }
            owner_player_id: { type: integer }
            owner_is_local_player: { type: boolean }
            is_selected: { type: boolean }  # T213 (2026-09-21): the game's head-selected unit; every unit action's availability predicate reads it
            plot:
              type: object
              required: [x, y]
              properties: { x: { type: integer }, y: { type: integer } }
            movement_remaining: { type: number }
            max_movement: { type: number }
            is_fortified: { type: boolean }
            reachable_plots:
              type: array
              items:
                type: object
                properties: { x: { type: integer }, y: { type: integer } }
            can_found_city: { type: boolean }
            # The promotions this unit's own promotion tree is offering, as UnitPromotionType
            # names. Sourced from the panel's own query
            # (steamassets/base/assets/ui/panels/unitpanel.lua:435-446,
            # popups/unitpromotionpopup.lua:285-291); the previous body asked a method Civ VI does
            # not have, so this was `[]` on every record in the store.
            available_promotions:
              type: array
              items: { type: string }
            # Why the promotion list is empty, when the panel's own query could not be asked at
            # all -- never a silent `[]`.
            available_promotions_reason: { type: string }
            charges_remaining: { type: [number, "null"] }
            # The unit panel's build buttons, reported for the SELECTED unit only -- those buttons
            # exist only on the panel of the unit a human has selected
            # (steamassets/base/assets/ui/panels/unitpanel.lua:545-546, :554-573). Same shape as
            # cities.state's pair: `available_builds` is the live-button subset and is what
            # units.build_improvement's availability predicate reads
            # (`target in unit.available_builds`), so it stays a list of plain type names;
            # `build_options` is the panel's list row for row, greyed rows included.
            available_builds:
              type: array
              items: { type: string }
            build_options:
              type: array
              items:
                type: object
                required: [improvement_type, disabled]
                properties:
                  improvement_type: { type: string }
                  # Locale.Lookup(improvement.Name) -- the label printed on the button
                  # (unitpanel.lua:574).
                  name: { type: string }
                  disabled: { type: boolean }
                  # UnitOperationResults.BEST_IMPROVEMENT: the row the panel frames as the
                  # recommended action (unitpanel.lua:563, :595-600, :919-933).
                  is_recommended: { type: boolean }
            # Why the build list is empty, when the panel's own query could not be asked at all --
            # never a silent `[]` (the failure that hid cities.state's empty available_productions).
            available_builds_reason: { type: string }
            # 2026-09-21 accessor audit: `queued_path` is gone. It was emitted only when
            # `unit:GetActivityType() == UnitActivityType.ACTIVITY_OPERATION` -- a method that is
            # not on the unit (the real one is `UnitManager.GetActivityType(pUnit)`,
            # unitpanel.lua:2147) and an enum table that does not exist (`ActivityTypes`,
            # unitpanel.lua:2148) -- and its only field, `destination`, was hard-coded nil because
            # no accessor in the shipped corpus can say where a unit is already headed. A field
            # whose only possible value is null is a claim the harness cannot keep (Principle I).
            # What a human can see -- the badge on the unit flag saying it has standing orders --
            # is reported instead.
            has_queued_orders: { type: boolean }
            has_queued_orders_reason: { type: string }
  introduced_in_version: "2026.09.1"
