# catalogs/observations/great_people.yaml
# Backed by lua/gamecore/great_people.lua (capability_id: great_people.read).
#
# Not named in tasks.md T090's literal file list (which enumerates map/cities/units/research/
# diplomacy/religion/government/congress/espionage), but required so that lua/gamecore/
# great_people.lua (T083) and catalogs/actions/great_people.yaml (T091) both resolve a real
# observation declaration rather than a dangling capability. Added as a necessary, narrowly
# scoped completion of T090's intent, called out in the authoring report.

- declaration_id: great_people.state
  kind: observation
  summary: >
    The great-person cards the Great People screen is currently offering, each flagged with
    whether its Recruit button is live, and the local player's own accumulated points per
    great-person class.
  parity_basis: >
    Open the Great People screen and read the cards it is currently offering -- their class,
    their point threshold, and whether Recruit is available -- and the local player's own point
    totals per class.
  # 2026-09-21: moved GameCore_Tuner -> InGame after the 20:46 client segfault (a NULL
  # government definition dereferenced inside IsGovernmentUnlocked). Every accessor this
  # body calls is one Firaxis calls from an InGame screen; the same call from the gamecore
  # tuner state resolved no definition. UNVERIFIED LIVE until a crash-watched block runs it.
  context: InGame
  capability_id: great_people.read
  output_schema:
    type: object
    required: [recruitable_individuals, points_by_class]
    properties:
      recruitable_individuals:
        type: array
        items:
          type: object
          required: [individual_id, class_type, name, is_recruitable]
          properties:
            individual_id: { type: integer }
            class_type: { type: [string, "null"] }
            name: { type: string }
            # greatpeoplepopup.lua:723 `entry.Cost` -- the point threshold the panel renders as
            # "<points>/<threshold>". Named `points_required` because `cost` is a banned key.
            points_required: { type: [number, "null"] }
            # greatpeoplepopup.lua:728 CanRecruitPerson -- exactly what shows (:265-269) or hides
            # (:276) the Recruit button. `great_people.recruit` reads this off the targeted row.
            is_recruitable: { type: boolean }
      # Present only when the list could not be read at all -- never a silent `[]`. See the
      # 2026-09-21 accessor audit: GetAvailableIndividuals/GetPlayerPoints were invented names.
      recruitable_individuals_reason: { type: string }
      points_by_class:
        type: array
        items:
          type: object
          required: [class_type, points]
          properties:
            class_type: { type: string }
            points: { type: number }
            points_per_turn: { type: [number, "null"] }
      points_by_class_reason: { type: string }
  introduced_in_version: "2026.09.1"
