# catalogs/actions/cities.yaml
# Backed by lua/ingame/city_orders.lua (capability_id: cities.orders). Verification re-reads
# cities.state (lua/gamecore/cities.lua) after execution.

# Gameplay day (2026-09-21): the one order that makes the rest of this file reachable. Every city
# order below begins `city.is_selected and ...`; MEASURED in gameplay block 2 (run-d2184c44) that
# nothing ever selected a city, so the model wrote "no city currently selected (so city actions
# cannot act on it)" and no production was ever set. Backed by lua/ingame/selection_orders.lua
# (capability_id: selection.orders): `UI.SelectCity`, the click on a city banner, which also opens
# the city panel (measured live at game turn 25). Verified through cities.selection (T255).
- declaration_id: cities.select
  kind: action
  summary: >
    Select one of your cities (opens its panel) so the following city orders act on it. parameters: {"target": <that city's city_id from cities.state>}.
  parity_basis: >
    Click the city's banner on the map; the game selects it and opens the city panel with its
    production choices.
  context: InGame
  capability_id: selection.orders
  availability_predicate: >
    city.exists and city.owner_is_local_player
  verification_predicate: >
    city.is_selected
  target_kind: city_id
  target_hint: >
    the city_id of one of your own cities from cities.state; then set its production
  introduced_in_version: "2026.09.4"

- declaration_id: cities.set_production
  kind: action
  summary: >
    Set the selected city's current production to an available item. parameters: {"target": "<an item from that city's available_productions, e.g. UNIT_BUILDER>"}.
  parity_basis: >
    Open the city's production panel and click an available production item. The click replaces
    the head of the build queue, which is what this issues
    (steamassets/base/assets/ui/panels/productionpanel.lua:299-301, :2896-2897).
  context: InGame
  capability_id: cities.orders
  availability_predicate: >
    city.is_selected and city.owner_is_local_player and target in city.available_productions
  verification_predicate: >
    target in city.production_queue
  target_kind: name
  target_hint: >
    an item from the selected city's available_productions (its `type`, e.g. UNIT_BUILDER);
    production_options carries each item's name, kind, production_required and turns
  introduced_in_version: "2026.09.1"

- declaration_id: cities.purchase_with_gold
  kind: action
  summary: Purchase an available production item with gold.
  parity_basis: >
    Open the city's production panel, switch to the gold-purchase tab, and click a purchasable
    item.
  context: InGame
  capability_id: cities.orders
  availability_predicate: >
    city.is_selected and city.owner_is_local_player and city.can_buy_with_gold
    and target in city.purchasable_with_gold
  verification_predicate: >
    not (target in city.purchasable_with_gold)
  target_kind: name
  target_hint: >
    an item from the selected city's purchasable_with_gold
  introduced_in_version: "2026.09.1"

- declaration_id: cities.purchase_with_faith
  kind: action
  summary: Purchase an available production item with faith.
  parity_basis: >
    Open the city's production panel, switch to the faith-purchase tab, and click a purchasable
    item.
  context: InGame
  capability_id: cities.orders
  availability_predicate: >
    city.is_selected and city.owner_is_local_player and city.can_buy_with_faith
    and target in city.purchasable_with_faith
  verification_predicate: >
    not (target in city.purchasable_with_faith)
  target_kind: name
  target_hint: >
    an item from the selected city's purchasable_with_faith
  introduced_in_version: "2026.09.1"
