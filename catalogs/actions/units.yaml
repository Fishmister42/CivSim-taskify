# catalogs/actions/units.yaml
# Backed by lua/ingame/unit_orders.lua (capability_id: units.orders). Verification re-reads
# units.state (lua/gamecore/units.lua) after execution. See catalogs/README.md §4 for the `unit.*`
# and `target` predicate symbols used below.

# Gameplay day (2026-09-21): the one order that changes which unit the others act on. Backed by
# lua/ingame/selection_orders.lua (capability_id: selection.orders). With a single unit the game's
# own auto-selection hid the gap; with two the model could only ever order the one the game had
# picked. `target` here is the unit's own id (the subject and the target are the same thing,
# exactly as for units.found_city with an explicit target).
- declaration_id: units.select
  kind: action
  summary: >
    Select one of your units so the following unit orders act on it. parameters: {"target": <that unit's unit_id from units.state>}.
  parity_basis: >
    Click the unit on the map (or its flag); the game selects it and shows its orders.
  context: InGame
  capability_id: selection.orders
  availability_predicate: >
    unit.exists and unit.owner_is_local_player
  verification_predicate: >
    unit.is_selected
  target_kind: unit_id
  target_hint: >
    the unit_id of one of your own units from units.state; then issue its orders
  introduced_in_version: "2026.09.4"

- declaration_id: units.move_to
  kind: action
  summary: >
    Order the selected unit to move to a target plot. parameters: {"target": {"x": .., "y": ..}} -- a plot from that unit's reachable_plots.
  parity_basis: >
    Select the unit, then left-click a reachable plot within its movement range (or its
    multi-turn path indicator).
  context: InGame
  capability_id: units.orders
  availability_predicate: >
    unit.is_selected and unit.owner_is_local_player and unit.movement_remaining > 0
    and target in unit.reachable_plots
  # 2026-09-21 accessor audit: the second disjunct used to be
  # `unit.queued_path != null and unit.queued_path.destination == target`. That field could never
  # hold a destination -- its guard called a method the unit does not have and its only value was
  # hard-coded nil -- so the disjunct was always false and is removed rather than left as dead
  # weight in the rendered predicate. A multi-turn order now verifies on the turn the unit
  # arrives, which is the only thing the game will actually tell us.
  verification_predicate: >
    unit.plot == target
  target_kind: plot
  target_hint: >
    a destination plot from the selected unit's reachable_plots -- the plot, never the unit's id
  introduced_in_version: "2026.09.1"

# T313 (2026-09-22, live lane): the verification used to be `not unit.exists` -- whether the
# Settler disappeared. That fabricates: a Settler also disappears when it is captured or killed,
# not only when it founds a city (MEASURED the same day: Georgia captured five Builders and a
# capital on the previous board). `run-f9aea1fc1c7346eca0e72cf6d8492882` proved it landed on a real
# founding -- `n_cities` walks 0 -> 1 -> `LOC_CITY_NAME_PASARGADAE`, persisting across a turn
# boundary -- while the 4.0 s confirm bound (owned by a separate task, not touched here) expired at
# 7.291 s and the step was recorded `rejected`. Fixing the bound alone would leave a captured
# Settler indistinguishable from a founded city: both make `unit.exists` false.
#
# Per the owner's own fix ("You can programmatically interface with multiple cities right? Just
# count those."): verification now reads `player.city_count`, a real, positive count of the local
# player's own cities from `cities.state` (`act/predicates.py`'s `_local_player_city_count`,
# T313), compared before/after through the same `observed_*` pre-execution-snapshot mechanism
# `turn.end_turn`'s own `observed_turn_number + 1` already uses (catalogs/README.md §4) -- not a
# new mechanism. The leading `player.city_count != null` conjunct is the documented polarity
# guard: `cities.state` absent or its `cities` field null/missing binds `player.city_count` to
# `None`, and this conjunct short-circuits the `and` to `False` before the `>` comparison -- which
# would otherwise raise on `None > observed_city_count` -- ever runs. Either way the result is
# `False`/unevaluable, never a fabricated `True` (FR-011). See
# `tests/unit/test_predicates.py`'s `units.found_city` tests for the capture-case, real-shape, and
# polarity proofs.
#
# KNOWN GAP, explicitly not closed here (out of this task's scope, see its own report):
# `observed_city_count` is not yet registered in `act/verify.py`'s `_OBSERVED_FIELD_SOURCES` table
# -- the one place a pre-execution `observed_*` snapshot is actually flattened -- and that file is
# off-limits to this task. Until a one-line addition there
# (`"observed_city_count": ("player", "city_count")`) lands, evaluating this predicate against a
# real pre/post observation pair raises `PredicateEvaluationError` on the unbound name whenever
# `player.city_count` itself resolves (the ordinary case, since `cities.state` is read every step);
# `verify_execution` maps that identically to `False`/`rejected`, per its own module docstring --
# so this fails closed, never applied, until the follow-up wiring lands. That is a strict
# improvement over the fabrication this replaces (a captured Settler recorded as a founded city),
# at the cost of `units.found_city` being unable to confirm `applied` at all in the meantime.
- declaration_id: units.found_city
  kind: action
  summary: >
    Found a city with a settler unit at its current plot. parameters: {"target": <the settler's
    unit_id>}; with no target, the currently selected unit is used.
  parity_basis: >
    Select a settler unit and click the "Found City" command in its unit action panel.
  context: InGame
  capability_id: units.orders
  availability_predicate: >
    unit.is_selected and unit.owner_is_local_player and unit.can_found_city
  verification_predicate: >
    player.city_count != null and player.city_count > observed_city_count
  target_kind: none
  target_hint: >
    acts on the selected settler; send no target, or that settler's unit_id
  introduced_in_version: "2026.09.1"

# Gameplay day (2026-09-21): the first action in this catalog that spends a builder charge. The
# goal `use_a_builder` (tests/live/goals/use_a_builder.yaml) was authored blocked on exactly this
# gap -- "NO action in catalogs/actions/ spends a builder charge" -- and the harness had never
# built an improvement.
- declaration_id: units.build_improvement
  kind: action
  summary: >
    Spend one of the selected unit's build charges to improve the tile it is standing on.
    parameters: {"target": "<an improvement_type from that unit's available_builds>"}.
  parity_basis: >
    Select a Builder standing on the tile, then click that improvement's button in the build row
    of its unit action panel (the row the panel fills from the improvements this plot offers).
  context: InGame
  capability_id: units.orders
  # `unit.charges_remaining > 0` is the charge counter on the panel; `target in
  # unit.available_builds` is that improvement's button being present and not greyed out. A unit
  # that is not a builder has no build buttons at all, so its available_builds is empty and this
  # can never hold for it.
  availability_predicate: >
    unit.is_selected and unit.owner_is_local_player and unit.charges_remaining > 0
    and target in unit.available_builds
  # The charge counter going down by one is what a human watches.
  #
  # CORRECTED 2026-09-22 (headless), and the correction is the point: the "DOCUMENTED LIMIT"
  # recorded here used to say the game selects another unit only when a Builder spends its LAST
  # charge and is consumed. **The real behaviour is far broader** -- Civ VI auto-cycles the
  # selection off a unit after ANY completed order. MEASURED, turn cycle
  # `1b68484f1ed240c8864d1cf5094ebd31` at 21:27Z: the Builder 458754 built IMPROVEMENT_MINE on
  # (44,30) on an ORDINARY charge, its charges went 3 -> 2, the dispatch answered `ok: true`, and
  # the step was still recorded `rejected` -- because by the confirming read the game had selected
  # a Settler with 0 charges and `unit` bound to it: `0 == 3 - 1`. The final read was assembled
  # 1.8 ms before the rejection was stamped, so it had the right data and scored it wrong; no
  # confirm timeout could have helped.
  #
  # FIXED at the binding, not at the predicate text: `act/predicates.py`'s `acted_subject_ids`
  # binds `unit` to the unit the ORDER'S OWN ANSWER names (`unit_id`), on both sides of the
  # comparison, so the predicate below now reads the Builder whatever the game has since selected.
  #
  # The genuine last-charge limit REMAINS, and stays conservative on purpose (FR-011): a Builder
  # consumed by its final charge is gone from `units.state`, the namespace binds absent, the
  # comparison is unevaluable and the step reads rejected even though the improvement was built.
  # The plot's own `improvement` in map.state is the reading that covers it, and the goal run's
  # success predicate already accepts either.
  verification_predicate: >
    unit.charges_remaining == observed_charges_remaining - 1
  target_kind: name
  target_hint: >
    an improvement_type from the selected unit's available_builds, e.g. IMPROVEMENT_FARM --
    the improvement, never the unit's id or a plot
  introduced_in_version: "2026.09.9"

- declaration_id: units.promote
  kind: action
  summary: Apply an available promotion to a unit.
  parity_basis: >
    Select a unit with an available promotion and click that promotion in its promotion tree
    panel.
  context: InGame
  capability_id: units.orders
  availability_predicate: >
    unit.is_selected and unit.owner_is_local_player and target in unit.available_promotions
  verification_predicate: >
    not (target in unit.available_promotions)
  target_kind: name
  target_hint: >
    a promotion from the selected unit's available_promotions
  introduced_in_version: "2026.09.1"
