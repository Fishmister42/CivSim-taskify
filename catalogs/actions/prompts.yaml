# catalogs/actions/prompts.yaml
# T093 (US1). Backed by lua/ingame/screens.lua (capability_id: prompts.orders — the `respond`
# function; `probe` backs game.screen_state in catalogs/observations/game.yaml). Every entry here
# is a `prompt_response` decision (data-model.md §9's `trigger` field), answered at its own
# decision step, per FR-010 and research R13.
#
# Dependency note: each availability_predicate below checks `target in prompt.options`, but
# lua/ingame/screens.lua's current CivSim_Screens_Probe() returns an empty prompt_options list as
# an explicitly flagged placeholder (per-prompt option enumeration is not yet implemented). These
# predicates are written for the completed probe, not the current stub — evaluating them today
# would make every prompt action unavailable until that gap is closed. This is the honest
# state of things, not a hidden inconsistency: see lua/ingame/screens.lua's header.
#
# "AI diplomatic approach" and "declaration of war" are both diplomacy-initiated modal prompts but
# distinct moments (the AI announcing its posture vs. the AI declaring war on the local player),
# so they get separate declarations. "World Congress vote" here (prompts.congress_vote) is the
# modal, forced-response vote moment; catalogs/actions/congress.yaml's congress.cast_vote is the
# separate, proactive vote a player may cast while a session is open but not yet forcing a
# response — the two are deliberately not merged.

- declaration_id: prompts.unit_promotion
  kind: action
  summary: Respond to a unit-promotion prompt.
  parity_basis: >
    A promotion-available prompt appears for a unit that gained a promotion; pick a promotion
    or dismiss it in that prompt.
  context: InGame
  capability_id: prompts.orders
  availability_predicate: >
    game.has_blocking_prompt and game.current_screen == "prompt.unit_promotion"
    and target in prompt.options
  verification_predicate: >
    game.current_screen != "prompt.unit_promotion"
  target_kind: option
  target_hint: >
    one of the open prompt's offered options (prompt_options)
  introduced_in_version: "2026.09.1"

