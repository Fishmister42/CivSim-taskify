# RETIRED 2026-09-21: `prompts.city_state_quest` (and its screen id `prompt.city_state_quest`)
# stood here. There is no city-state quest popup in the shipped UI at all -- quests arrive as
# notifications and are read in the browsable `CityStates` partial screen -- and nothing in
# Civ VI accepts or declines a quest, so "accept or decline it in that prompt" described an
# interaction the game does not have. The claim was wrong, so it is withdrawn rather than mapped.
# Evidence, with file:line citations into Firaxis's shipped UI Lua:
# specs/002-civ-playing-harness/spikes/screens-unmapped-2026-09-21.md
# ("`prompt.city_state_quest` — unmappable, and the catalog claim is wrong"); recorded in
