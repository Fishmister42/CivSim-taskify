# GAP CLOSED 2026-09-21 (measured live, game turn 57). The write-up
# specs/002-civ-playing-harness/spikes/screens-unmapped-2026-09-21.md called this id unmappable,
# and for the mechanism it examined it was: `WorldCongressPopup`
# (dlc/expansion2/ui/replacements/ingame.xml:121) is ONE context for every stage of a congress --
# proposals, the vote itself (`OnVoteResolution`/`OnVoteProposal`, worldcongresspopup.lua:983,
# :1452) and results (`OnWorldCongressResults`, :2347) -- and which stage is up lives in
# `m_CurrentStage`/`m_CurrentPhase`, private to that context's own Lua state, so
# `ContextPtr:IsHidden()` can never tell the forced vote from browsing the session. Mapping the id
# to that state would fabricate a distinction AND shadow `congress`, so it still is not mapped
# there.
#
# What changed is the same thing that changed for `prompt.diplomatic_approach` (commit 7efb1d7):
# the stage is not only a private variable, it is also something the screen SHOWS. `UpdateNavButtons`
# (worldcongresspopup.lua:380-425) expresses the stage as the visibility and disabled state of
# three named buttons declared directly in the popup's own `ButtonStack`
# (worldcongresspopup.xml:117-124) -- `NextButton`, `AcceptButton`, `PassButton` -- and those ARE
# readable from InGame through `ContextPtr:LookUpControl`. The probe reports
# `prompt.congress_vote` when the popup is open and at least one of them is visible and enabled,
# and the ordinary `congress` screen otherwise. See lua/ingame/screens.lua's CIVSIM_CONGRESS_STATE.
#
# SCOPE: this answers the congress's navigation, not its content. Casting an actual vote --
# picking a resolution's option, spending favor, upvoting or downvoting a proposal -- lives in
# per-instance pulldowns and vote steppers inside the popup and is deliberately NOT mapped; an
# agent using this action abstains, which is a thing a human may do (`CanSubmit` returns true for
# the ordinary session stages, worldcongresspopup.lua:347, so Submit is clickable with no votes
# cast). catalogs/actions/congress.yaml's `congress.cast_vote` remains the separate claim for
# casting a vote, and it is not satisfied by this.

- declaration_id: prompts.congress_vote
  kind: action
  summary: >
    Answer the open World Congress page by clicking one of its own navigation buttons
    ({"target": "next"} / {"target": "accept"} / {"target": "pass"}) -- move to the next page of
    proposals, submit the page as it stands (with no votes cast, this abstains), or pass on a
    special-session proposal. It does not cast votes.
  parity_basis: >
    The World Congress popup shows the proposals of the current page with Next, Submit and Pass
    buttons along its bottom edge; a human clicks Next to page through them and Submit to send
    the page as it stands. Only the buttons that are visible and not greyed out are offered --
    Prev and Return, which navigate backwards rather than answer, are never offered.
  context: InGame
  capability_id: prompts.orders
  availability_predicate: >
    game.has_blocking_prompt and game.current_screen == "prompt.congress_vote"
    and target in prompt.options
  verification_predicate: >
    game.current_screen != "prompt.congress_vote"
  target_kind: option
  target_hint: >
    one of the open prompt's offered options (prompt_options): "next", "accept" or "pass"
  introduced_in_version: "2026.09.1"

