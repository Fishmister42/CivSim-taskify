# MEASURED live 2026-09-21 (live stage, game turn 58): a conversation offered exactly one choice,
# "Goodbye", the model chose it 16 times, and the leader scene was still up after every one.
# "Goodbye" is the conversation's EXIT, not a statement: `OnSelectConversationDiplomacyStatement`
# branches `CHOICE_EXIT` off before every statement case and runs `ExitConversationMode()`, whose
# whole effect is `DiplomacyManager.CloseSession` (diplomacyactionview.lua:488-493, :310-330).
# The answer now recognises that choice by the game's own text for it (`LOC_DIPLO_CHOICE_EXIT`,
# the single text tag every shipped `CHOICE_EXIT` selection carries) and closes the session;
# every other choice is still answered by clicking its own button. The result records which
# route ran. It remains one answer per step: a leader replies and the session stays open until
# the conversation's own Exit is taken, so the probe reports the prompt again with the new
# options (measured 2026-09-21, block 9).

- declaration_id: prompts.ai_diplomatic_approach
  kind: action
  summary: Respond to an AI civilization's diplomatic-approach prompt.
  parity_basis: >
    An AI leader's diplomatic-approach prompt appears when they open a diplomatic conversation;
    pick a response in that prompt. The conversation's own "Goodbye" choice is offered too --
    it is a button a human can click, and taking it leaves the conversation.
  context: InGame
  capability_id: prompts.orders
  availability_predicate: >
    game.has_blocking_prompt and game.current_screen == "prompt.diplomatic_approach"
    and target in prompt.options
  verification_predicate: >
    game.current_screen != "prompt.diplomatic_approach"
  target_kind: option
  target_hint: >
    one of the open prompt's offered options (prompt_options)
  introduced_in_version: "2026.09.1"

