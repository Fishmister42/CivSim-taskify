# MEASURED live 2026-09-21, three findings, all from the store rather than from reasoning.
#
# 1. The answer did not land. After a reload onto Georgia's first-meeting greeting at game turn 42,
#    three goal runs stuck 16 of 16 steps here. Across all 16 steps of `run-d0933ca8...`,
#    `prompt_options` was byte-identical -- the greeting's two choices, never a reply -- so nothing
#    the harness did reached the game. Handing the harness the button's rectangle for a host click
#    had never been demonstrated on a conversation button, only on the era card. What HAD been
#    demonstrated, on this same greeting at 12:35 EDT, was
#    `DiplomacyManager.AddResponse(session, localPlayer, "NEGATIVE")`. So the direct call the
#    button's own handler makes is now the primary route and the click is the fallback. The call
#    is chosen by the selection's `CHOICE_*` key, read from the game's own `DiplomacySelections`
#    rows (`DB.Query`, as diplomacystatementsupport.lua:77-84 reads them) rather than inferred
#    from the label: `CHOICE_POSITIVE`/`CHOICE_NEGATIVE`/`CHOICE_IGNORE` -> `AddResponse`,
#    `CHOICE_EXIT` -> `CloseSession` (diplomacyactionview.lua:489-534). The war, peace, deal and
#    demand keys keep the click path with the key recorded -- they have their own catalog actions
#    and are not worth firing off a label lookup.
#
# 2. The verification predicate could never pass for a statement. It asked for the conversation to
#    be gone, but a correct statement answer leaves it OPEN: the leader replies and the session
#    stays up until the conversation's own exit is taken (measured 12:35 EDT, and again in block
#    9). It now verifies on the chosen statement no longer being offered, which is true both when
#    the leader has replied with a new set of choices and when the session has closed (an ended
#    conversation offers nothing at all).
#
# 3. The exit was being recognised by the wrong thing. A first meeting's decline IS `CHOICE_EXIT`
#    but carries its own text -- `<Key>CHOICE_EXIT</Key><Text>LOC_DIPLO_CHOICE_FIRST_MEET_DECLINE_
#    VISIT</Text>` (diplomacystatements_firstmeet.xml:172-178, and four more of that shape) --
#    so matching the generic "Goodbye" string could never have caught it. Resolving by key does.

- declaration_id: prompts.ai_diplomatic_approach
  kind: action
  summary: >
    Respond to an AI civilization's diplomatic-approach prompt ({"target": the choice's text as
    prompt_options lists it}). One answer per step: the leader replies and the conversation stays
    open with a new set of choices until its own exit choice is taken.
  parity_basis: >
    An AI leader's diplomatic-approach prompt appears when they open a diplomatic conversation;
    pick one of the reply buttons under the leader. The conversation's own decline/leave choice is
    offered too -- it is a button a human can click, and taking it leaves the conversation.
  context: InGame
  capability_id: prompts.orders
  availability_predicate: >
    game.has_blocking_prompt and game.current_screen == "prompt.diplomatic_approach"
    and target in prompt.options
  # CORRECTED 2026-09-22 (T322), from the store rather than from reasoning. The predicate below
  # used to be the bare `target not in prompt.options`, and the note that stood here defended it as
  # covering "both the cases that count". It covered a third case it never named: **the option list
  # simply emptying**. That is a negative over a container, and a negative over a container is
  # satisfied by success, by the prompt vanishing, by the board moving on, and by nothing happening
  # at all -- so a no-op records `applied`, the one failure direction nothing downstream can detect.
  #
  # MEASURED (civsim-match-store.db, 2026-09-22): all 14 `applied` records for this action
  # confirmed on the FIRST post-dispatch read (`confirm_attempts: 1`, `confirm_elapsed_s: 0.0`),
  # and **12 of the 14 were decided by `prompt_options: []`** -- the empty list, not a changed one.
  # In 7 of those the engine's own `raw_screen_id` was UNCHANGED across the action
  # (`DiplomacyActionView` before and after); in the other 5 it had moved to `InGame`. The old
  # predicate read both identically.
  #
  # `d74a4c7` ("a comparison whose operand went missing is now unevaluable") does NOT close this,
  # and two of the fourteen were recorded with it already in the running tree. It cannot fire here:
  # `act/predicates.py::_bind_prompt_namespace` hard-defaults `options` to `[]`, so the right
  # operand is never absent. That fix closes ABSENCE; this defect is EMPTINESS, and **an empty list
  # is a value** -- the project's own standing rule.
  #
  # So the predicate now asserts what the action MADE TRUE, in the two endings the live record
  # actually shows, and nothing else:
  #   1. the conversation is still up AND is offering a set that no longer holds the chosen
  #      statement -- the leader replied (MEASURED 2026-09-21 12:35 EDT, and live in block 37,
  #      where answering a first-meeting statement left `prompt.diplomatic_approach` open with a
  #      genuinely different `["Goodbye"]`); or
  #   2. the world is back -- the conversation ended (MEASURED live: `screen: world` with
  #      `raw_screen_id: InGame`, the engine's own context, not just the harness's classification).
  # Emptying the list while the diplomacy context stays up satisfies neither, which is the whole
  # point. The swallowed-click case (`prompt_options` byte-identical, 16/16 steps of
  # `run-d0933ca8...`) is still caught by branch 1's `target not in prompt.options`.
  #
  # NOT claimed: that the 7 were no-ops. This build exposes no session-state read, and the
  # `CloseSession()`-does-nothing explanation was RETRACTED on 2026-09-22
  # (specs/002-civ-playing-harness/analyze-2026-09-22.md -- the tuner returns the pre-call value
  # when the readback rides in the same command). What is established is that the OLD predicate
  # could not tell the two apart and recorded `applied` either way.
  #
  # Written as ONE folded line on purpose: YAML's `>` keeps the newline before a line indented
  # further than the first, so an expression broken across lines with a hanging indent reaches the
  # evaluator as a genuine multi-line string and fails to parse. Caught here by the tests, not live.
  verification_predicate: >
    (game.current_screen == "prompt.diplomatic_approach" and prompt.is_active and
    target not in prompt.options) or (game.current_screen == "world" and
    game.raw_screen_id == "InGame")
  target_kind: option
  target_hint: >
    one of the open prompt's offered options (prompt_options), exactly as it is written there
  introduced_in_version: "2026.09.1"

