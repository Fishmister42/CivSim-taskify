# catalogs/actions/prompts.yaml
# T093 (US1). Backed by lua/ingame/screens.lua (capability_id: prompts.orders — the `respond`
# function; `probe` backs game.screen_state in catalogs/observations/game.yaml). Every entry here
# is a `prompt_response` decision (data-model.md §9's `trigger` field), answered at its own
# decision step, per FR-010 and research R13.
#
# Dependency note: each availability_predicate below checks `target in prompt.options`, and
# lua/ingame/screens.lua enumerates those options per prompt FAMILY, not for every family at once.
# As of catalog 2026.09.8 the families that report options are: the acknowledge-only popups (one
# option each — `continue`, or `accept` for the congress welcome card), the diplomatic approach
# (the visible, enabled statement buttons' own labels), the congress page (`next` / `accept` /
# `pass`, whichever is live) and the era dedication chooser (the visible commemoration labels).
# The rest still report an empty list, which keeps those actions unavailable rather than guessed
# at — the honest state of things, not a hidden inconsistency. See lua/ingame/screens.lua's
# CivSim_Screens_State.
#
# "AI diplomatic approach" and "declaration of war" are both diplomacy-initiated modal prompts but
# distinct moments (the AI announcing its posture vs. the AI declaring war on the local player),
# so they get separate declarations. "World Congress vote" here (prompts.congress_vote) is the
# open congress page's own navigation -- Next / Submit / Pass -- which a human must answer to get
# out of the session; catalogs/actions/congress.yaml's congress.cast_vote is the separate,
# proactive vote a player may cast on a particular resolution, and it is NOT satisfied by this.
# The two are deliberately not merged. `prompts.congress_intro` is the welcome card that opens a
# session, a third and distinct moment.
#
# MEASURED 2026-09-21 (live stage, game turns 56-57): once the welcome card is gone, the congress
# session popup itself does NOT block the turn -- an end turn advanced 56 -> 57 with the session
# on screen, its Next button visible but greyed out and Submit not yet shown. That is why the
# probe reports the plain `congress` screen for an open session and only reports
# `prompt.congress_vote` when one of the navigation controls is actually visible AND enabled: a
# blocking prompt has to be something the human can, and must, act on.

- declaration_id: prompts.unit_promotion
  kind: action
  summary: Respond to a unit-promotion prompt.
  parity_basis: >
    A promotion-available prompt appears for a unit that gained a promotion; pick a promotion
    or dismiss it in that prompt.
  context: InGame
  capability_id: prompts.orders
  availability_predicate: >
    game.has_blocking_prompt and game.current_screen == "prompt.unit_promotion"
    and target in prompt.options
  verification_predicate: >
    game.current_screen != "prompt.unit_promotion"
  target_kind: option
  target_hint: >
    one of the open prompt's offered options (prompt_options)
  introduced_in_version: "2026.09.1"

