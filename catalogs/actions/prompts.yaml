# MEASURED live 2026-09-21 (gameplay block 20, Classical era): the era card's Continue leads
# straight here. `erareviewpopup.lua`'s `OnContinue` (:241-247) dequeues the card and then raises
# `LuaEvents.EraReviewPopup_MakeDedication`, which `dedicationpopup.lua:293` answers by building
# and showing the chooser -- so `prompt.era_transition` is followed by `prompt.era_dedication`,
# never overlapped by it. The chooser was up for 41 harness steps with the text probe answering
# `world`; Sonnet 5 read it off the delivered frame and asked to answer it at 40 of them, and all
# 40 were refused. Nothing was wrong with the picture -- the id simply did not exist.
#
# The action is ONE CLICK PER STEP, which is also what a human does: name a commemoration and the
# harness clicks that card; name it again once it is ticked and the harness clicks Confirm, which
# the popup keeps greyed out until exactly `GetPlayerNumAllowedCommemorations` cards are ticked
# (dedicationpopup.lua:200-203). In a Golden or Heroic age, where more than one is allowed, each
# step names one more; the Lua answers `more_selections_required` with the counts and the labels
# still on the table until the popup itself enables Confirm. `prompt_options` are the visible,
# enabled cards' own `MomentCategory` labels ("Free Inquiry", "Monumentality", ...), and the
# probe reports `prompt_selections_allowed`, `prompt_selections_made` and
# `prompt_selected_options` alongside them -- the three things the card shows.
#
# The popup's X (`CloseButton` -> `UIManager:DequeuePopup`, dedicationpopup.lua:225-227) dedicates
# NOTHING. A human may do that, so it is kept, but only as a recorded fallback for a build where
# no control rectangle can be read at all, and the result then carries `dedication_made = false`.

- declaration_id: prompts.era_dedication
  kind: action
  summary: >
    Choose a dedication (commemoration) in the era dedication chooser
    ({"target": "MONUMENTALITY"}); it appears after the era-review card at every era change in
    Gathering Storm and blocks play until confirmed or dismissed. One click per step: the first
    call selects the named commemoration, the next confirms it.
  parity_basis: >
    The chooser fills the screen with "Make your Dedication for the <Era> Era" and one card per
    offered commemoration -- its name, its icon, and what it does for this age -- plus a Confirm
    button that stays greyed out until the allowed number of cards are ticked, and an X in the
    corner. A human clicks a card, sees Confirm light up, and clicks Confirm. Only the cards
    that are visible and not greyed out are offered.
  context: InGame
  capability_id: prompts.orders
  availability_predicate: >
    game.has_blocking_prompt and game.current_screen == "prompt.era_dedication"
    and target in prompt.options
  verification_predicate: >
    game.current_screen != "prompt.era_dedication"
  target_kind: option
  target_hint: >
    one commemoration's label exactly as prompt_options lists it; repeat the same target once it
    is ticked to confirm, and name a further label first when the age allows more than one
  introduced_in_version: "2026.09.8"

# T253 (2026-09-21). The two acknowledge-only popups. MEASURED live (attempt 5 of the first
# model-driven runs): the civic "Code of Laws" completed, `TechCivicCompletedPopup` came up, and
# the run stalled `UnknownScreenEncountered` because the state was on lua/ingame/screens.lua's
# watchlist but mapped to no catalog id -- play stopped there. Both popups offer exactly one
# option here, `continue`, which is what the popup's own Continue button (and its Escape handler)
# does: `UIManager:DequeuePopup`. The civic popup's extra "Change Government" button is deliberately
# not offered (a subset of the human's options, never a superset -- Principle I); governments and
# policies are changed through catalogs/actions/policies.yaml.

- declaration_id: prompts.tech_civic_completed
  kind: action
  summary: >
    Acknowledge the "technology / civic completed" popup ({"target": "continue"}); it appears
    when research or a civic finishes and blocks play until dismissed.
  parity_basis: >
    The completed-research popup shows the technology or civic with its quote and a Continue
    button; a human clicks Continue (or presses Escape) to close it and carry on. The civic
    version's "Change Government" button is not offered by this action.
  context: InGame
  capability_id: prompts.orders
  availability_predicate: >
    game.has_blocking_prompt and game.current_screen == "prompt.tech_civic_completed"
    and target in prompt.options
  verification_predicate: >
    game.current_screen != "prompt.tech_civic_completed"
  target_kind: option
  target_hint: >
    "continue" -- the popup offers nothing else
  introduced_in_version: "2026.09.4"

