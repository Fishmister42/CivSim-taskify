# catalogs/actions/policies.yaml
# Backed by lua/ingame/empire_orders.lua (capability_id: empire.orders). Verification re-reads
# government.state (lua/gamecore/government.lua) after execution.

- declaration_id: policies.slot_policy
  kind: action
  summary: Slot an available policy card into an open policy slot.
  parity_basis: >
    Open the Government screen and drag (or click) an available policy card into an open slot.
  context: InGame
  capability_id: empire.orders
  availability_predicate: >
    target in player.available_policies
  verification_predicate: >
    not (target in player.available_policies)
  introduced_in_version: "2026.09.1"

- declaration_id: policies.change_government
  kind: action
  summary: Change to an unlocked government.
  parity_basis: >
    Open the Government screen and click an unlocked government (only selectable when a
    government change is currently permitted).
  context: InGame
  capability_id: empire.orders
  availability_predicate: >
    target in player.available_governments
  verification_predicate: >
    player.current_government == target
  introduced_in_version: "2026.09.1"

- declaration_id: policies.assign_governor
  kind: action
  summary: Assign an appointed governor to a city.
  parity_basis: >
    Open the Governors panel and assign an appointed governor to a city.
  context: InGame
  capability_id: empire.orders
  availability_predicate: >
    city.is_selected and city.owner_is_local_player and target in player.available_governors
  verification_predicate: >
    not (target in player.available_governors)
  introduced_in_version: "2026.09.1"
