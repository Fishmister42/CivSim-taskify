# (spikes/r5-raw/GameCore_Tuner__namespaces.txt) lists Game.GetWinningTeam and Game.GetLocalPlayer
# as real functions in this context, so no spike was needed to establish reachability and no
# bespoke path is a legitimate design option here (Principle II).
