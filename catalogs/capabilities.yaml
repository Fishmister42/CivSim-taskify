- capability_id: prompts.orders
  path: bespoke
  implementation_ref: lua/ingame/screens.lua + src/civsim_harness/capability/executor.py
  reads: [currently open prompt and its offered options]
  writes: [prompt responses]
  firetuner_gap: >-
    Measured Firetuner gap, 2026-09-21: no Lua API reachable from InGame fires a control's
    registered callback. A prompt is answered by the callback its own button registered in the
    popup's own Lua state (base/assets/ui/popups/popupdialog.lua:215-217 releases the engine hold
    only after that callback runs), and nothing in the InGame context can invoke it:
    `control:CallCallback(Mouse.eLClick)` returned without error and fired nothing (blocks 13-15),
    and `UI.RespondToPrompt` — the generic primitive this once fell through to — appears in none
    of Firaxis' 645 shipped Lua files and in none of the shipped binaries' UI binding tables
    (spikes/lua-accessor-audit-2026-09-21.md). What this does instead: lua/ingame/screens.lua's
    `respond` returns the button's own on-screen rectangle (`GetScreenOffset` + `GetSizeVal`, the
    accessors diplomacyactionview.lua:1876 itself uses) plus the UI's own screen size, and
    src/civsim_harness/capability/executor.py `_perform_host_click_if_requested` scales it onto
    the game window and issues one mouse_move + one left mouse_click at its centre through
    HostPlatform.send_input — the same button, the same click, one click per dispatch, exactly
    what the human does. Firetuner-first still holds within the capability: where a direct call
    exists it is the primary route and the click is the fallback, with the reason the direct call
    was unavailable recorded on every result as `path` / `path_reason` — the diplomatic approach
    answers through `DiplomacyManager.AddResponse` / `CloseSession` keyed off the game's own
    `DiplomacySelections` rows and only clicks when that key is not directly answerable or the
    open-session count is not one; the acknowledge-only popups fall back to
    `UIManager:DequeuePopup` / `ContextPtr:SetHide` when the close control cannot be located or
    measured. The era dedication chooser and the congress page have no direct call at all.

