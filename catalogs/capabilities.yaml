# catalogs/capabilities.yaml
# T094 (US1). IntegrationCapability declarations binding every declaration_id in
# catalogs/observations/ and catalogs/actions/ to its lua/ implementation.
#
# Every entry below is path: firetuner EXCEPT prompts.orders, which is path: bespoke. Nothing in
# the original assignment's scope (T082-T094, T100, T130-T131) needed a bespoke capability: every
# declared observation, view, and action that author wrote had a Lua implementation reachable
# through the Nexus contexts (Principle II, Firetuner-first, satisfied by default there, not as an
# exception). The one bespoke capability named in contracts/capability-catalog.md's own worked
# example — saves.save_game — belonged to T077/T078, gated on the R5 save-path spike: T077 has
# since run against a real client and found Outcome A (a verified Firetuner Lua save path), so
# T078 declared it below as path: firetuner too, not bespoke — see catalogs/actions/saves.yaml and
# specs/002-civ-playing-harness/spikes/r5-save-path.md.
#
# CORRECTED 2026-09-22 — prompts.orders was path: firetuner and shipped a real synthetic click.
# The measurement of 2026-09-21 (blocks 13-15) found that no Lua API reachable from InGame fires a
# control's registered callback, so lua/ingame/screens.lua's `respond` now hands the harness a
# control rectangle and src/civsim_harness/capability/executor.py clicks it at its centre through
# HostPlatform.send_input (XTest on Linux). That is a bespoke synthetic-input path in the sense
# Principle II means, and declaring it `firetuner` meant the load-time bespoke/firetuner_gap rule
# (src/civsim_harness/models/catalog.py) passed over it vacuously — it only fires on
# `path: bespoke`. The declaration below is now what the code does. NOT split into a Firetuner
# capability plus a bespoke one, because a split would be a fiction: every answerable prompt
# family in CivSim_Screens_RespondToPrompt (the acknowledge-only popups, the diplomatic approach,
# the era dedication chooser and the congress page) can return a host-click request, so no
# declaration in catalogs/actions/prompts.yaml would be left on the pure-Firetuner side. Where a
# Firetuner call does exist it is still tried first, and the gap statement below says so.
# Guarded against recurrence by tests/contract/test_synthetic_input_declaration.py, which pins
# every in-harness HostPlatform.send_input call site as data and requires the capability it serves
# to be declared bespoke.

- capability_id: map.read
  path: firetuner
  implementation_ref: lua/gamecore/map.lua
  reads: [revealed map plots, terrain, features, visible resources, improvements]
  writes: []
  firetuner_gap: null

- capability_id: units.read
  path: firetuner
  implementation_ref: lua/gamecore/units.lua
