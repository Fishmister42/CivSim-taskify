# catalogs/capabilities.yaml
# T094 (US1). IntegrationCapability declarations binding every declaration_id in
# catalogs/observations/ and catalogs/actions/ to its lua/ implementation.
#
# Every entry below is path: firetuner. Nothing in this assignment's scope (T082-T094, T100,
# T130-T131) needed a bespoke capability: every declared observation, view, and action this
# author wrote has a Lua implementation reachable through the Nexus contexts (Principle II,
# Firetuner-first, is satisfied by default here, not as an exception). The one bespoke capability
# named in contracts/capability-catalog.md's own worked example — saves.save_game — belonged to
# T077/T078, gated on the R5 save-path spike: T077 has since run against a real client and found
# Outcome A (a verified Firetuner Lua save path), so T078 declared it below as path: firetuner
# too, not bespoke — see catalogs/actions/saves.yaml and
# specs/002-civ-playing-harness/spikes/r5-save-path.md.

- capability_id: map.read
  path: firetuner
  implementation_ref: lua/gamecore/map.lua
  reads: [revealed map plots, terrain, features, visible resources, improvements]
  writes: []
  firetuner_gap: null

- capability_id: units.read
  path: firetuner
  implementation_ref: lua/gamecore/units.lua
  reads: [unit state, movement, reachable plots, promotions]
  writes: []
  firetuner_gap: null

# 2026-09-21: the declaration this backs moved GameCore_Tuner -> InGame (see
# catalogs/observations/cities.yaml); the file keeps its path, exactly as lua/gamecore/units.lua
# did when units.state made the same move in T213.
- capability_id: cities.read
  path: firetuner
  implementation_ref: lua/gamecore/cities.lua
  reads: [city state, the production panel's list, production queue, purchasable items]
  writes: []
  firetuner_gap: null

# T255 (2026-09-21): the InGame half of city selection. cities.read runs in GameCore_Tuner, where
# `UI` does not exist, so `city.is_selected` -- the first term of every city order's availability
# predicate -- had no producer and no city order was ever dispatchable. See lua/ingame/city_selection.lua.
- capability_id: cities.selection
  path: firetuner
  implementation_ref: lua/ingame/city_selection.lua
  reads: [which city, if any, the player currently has selected]
  writes: []
  firetuner_gap: null

# Gameplay day (2026-09-21). Every unit order acts on the selected unit and every city order needs
# `city.is_selected`, and nothing in the catalog could change the selection -- a human clicks the
# unit or the city banner. This is that click (`UI.SelectUnit` / `UI.SelectCity`, measured live
# from the InGame tuner state). See lua/ingame/selection_orders.lua.
- capability_id: selection.orders
  path: firetuner
  implementation_ref: lua/ingame/selection_orders.lua
  reads: []
  writes: [which unit or city is selected on screen]
  firetuner_gap: null

# T258 (2026-09-21), Constitution III: the top bar's yields, so every turn record can carry them.
