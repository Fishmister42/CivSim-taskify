id: answer_first_meeting
order: 11
title: Answer another leader's first approach
turn_cap: 5

objective: >
  Another leader is speaking to you and is waiting for an answer. Read what is on screen and
  choose one of the responses you are offered.

success: observed_applied_prompts_ai_diplomatic_approach >= 1

prerequisites:
  # game.screen_state: the prompt must actually be up in the starting observation, and it must
  # be offering options -- prompts.ai_diplomatic_approach's availability_predicate is
  # `game.has_blocking_prompt and game.current_screen == "prompt.diplomatic_approach"
  #  and target in prompt.options`.
  - game.has_blocking_prompt
  - game.current_screen == "prompt.diplomatic_approach"
  - game.prompt_options != []

notes: >
  Cannot be provoked by the harness: a first meeting happens when the game decides it does, so
  this goal is only runnable from a save whose starting observation already has the approach
  prompt up -- which is precisely what --feasibility answers per milestone save. Unlike every
  other prompt family, prompt.diplomatic_approach DOES get real options
  (CivSim_DiplomacyStatementChoices in lua/ingame/screens.lua), so the action is reachable once
  the prompt is on screen.

  CORRECTED 2026-09-22 (T322). This note used to end "One of the five actions attempted live and
  never applied." That is no longer true and was already stale: block 37 (run-3edb5591,
  2026-09-22T21:20:47Z) reached this goal with two applies, and both survive the verification
  predicate's correction that same day -- re-derived by replaying each record's own post-execution
  observation. Seven OTHER applies of this action, in blocks 35 and earlier, do not survive it:
  they confirmed against an emptied `prompt_options` while the engine's `raw_screen_id` stayed
  `DiplomacyActionView`. So the honest statement is: applied live, twice, verified by replay --
  and the store's raw `applied` count for this action reads 14 while only 7 are supported.
