# Part two of the two-part builder chain. `depends_on` makes the driver run build_a_builder
# first, in the same client session, and carry its end state into this part.
#
# UNBLOCKED 2026-09-21 by 720e30d: `units.build_improvement` is the first action in the catalog
# that spends a builder charge, and `units.state` now reports the selected unit's own build
# buttons (`available_builds`, `build_options`, `available_builds_reason`). The goal was authored
# against the observations that already existed so that unblocking it was a `blocked_by` deletion
# and a sharper objective -- the success predicate below is unchanged.

id: use_a_builder
order: 13
title: Spend a Builder charge on a tile next to your city
turn_cap: 8
depends_on: build_a_builder

objective: >
  Spend one Builder charge to build an improvement on a tile next to your city. Select your
  Builder, move it onto a tile beside the city, and then choose one of the improvements its unit
  panel offers for the tile it is standing on. One of its charges is spent when the improvement
  is built.

# Either reading is accepted, whichever the observations expose first:
#   - units.state.charges_remaining, summed over the local player's Builders, goes down by one;
#     this also covers the case units.build_improvement's own verification_predicate cannot (a
#     Builder spending its LAST charge is consumed and leaves the map, so the sum falls to 0); or
#   - map.state.revealed_plots gains an `improvement` on a plot this player owns.
success: >
  player.units.builder_charges_total <= observed_start_builder_charges_total - 1
  or player.owned_improved_plot_count >= observed_start_owned_improved_plot_count + 1

prerequisites:
  # A Builder the player owns, with a charge left to spend. Deliberately NOT
  # `player.units.selected_available_builds != []`: units.state reports the build buttons for the
  # SELECTED unit only (they exist only on the open panel), and the Builder is not necessarily
  # the selected unit in the run's first observation -- selecting it and walking it to a tile
  # worth improving is the part of the item the agent is being asked to work out.
  - player.units.builder_count >= 1
  - player.units.builder_charges_total >= 1

notes: >
  Proves builder charge usage. The action is `units.build_improvement` (target: an
  improvement_type from the selected unit's `available_builds`, e.g. IMPROVEMENT_FARM); the
  improvements offered depend on the tile the Builder is standing on, so reaching a tile that
  offers one is part of the goal. The success predicate reads both of the fields the catalog
  declares, so whichever one the live client actually moves is enough -- and per 720e30d the
  action itself is UNVERIFIED against a running client, so the live stage should confirm
  `available_builds` is non-empty for a Builder beside a city.
