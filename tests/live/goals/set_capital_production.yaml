id: set_capital_production
order: 2
title: Set the capital's production
turn_cap: 3

objective: >
  Set what your capital is producing. Select your city first so its panel is open, then choose
  one of the production items the city offers and set it as the city's current production.

# cities.set_production's own verification_predicate is `target in city.production_queue`, so an
# `applied` outcome already means the harness re-read the city and saw the item queued. Both
# halves are required: the store record of the applied action, and the observation that the
# queue is no longer empty.
success: observed_applied_cities_set_production >= 1 and player.cities.production_queue != []

prerequisites:
  - player.cities.count >= 1
  - player.cities.available_productions != []


notes: >
  Unblocks as soon as the cities.state body reports real production options; the goal itself
  needs no change when it does.
