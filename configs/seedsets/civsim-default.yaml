# Composite platform/version identity, checked against the live client at
# every run's preflight (V10). A mismatch fails the run before turn 1 unless
# covered by an entry below (FR-002, FR-031, R20).
#
# The validation host this preset was read back on is Linux (native Aspyr),
# not Windows -- civsim-default-preset-linux.md's readable `.Civ6Cfg` header
# confirms `LINUX` / `1.0.12.9 (363760)` independently of the tuner
# read-back, and the tuner session itself reports client `1.0.12.9
# (564030)`. The composite below deliberately follows this host's own
# platform, unlike shuffle-classic-2026q3.yaml's `win/...` example.
game_build: "linux/1.0.12.9"

# A sensible handful of seeds for this set (digits of assorted mathematical
# constants, for the same easy-to-recognise-as-arbitrary reason
# shuffle-classic-2026q3.yaml uses pi/e/phi).
seeds:
  - "1414213562"  # sqrt(2)
  - "1732050808"  # sqrt(3)
  - "2236067977"  # sqrt(5)
  - "5772156649"  # Euler-Mascheroni constant
  - "1202056903"  # Apery's constant, zeta(3)

# Appended to only by an explicit operator action (`civsim seedset accept-build`).
# Empty here: no build drift has yet been accepted for this set.
accepted_build_changes: []

