# Seed set definition (contracts/run-configuration.md "Seed set definition").
#
# civilization, leader, ruleset, and mod_set are immutable after creation --
# changing one creates a new seed set, otherwise runs inside a set stop being
# comparable, which is the only reason the set exists (FR-031).
#
# Unlike shuffle-classic-2026q3.yaml (the generic worked example this file's
# shape is copied from -- left untouched), every value below is pinned to
# the `CivSim DEFAULT` Civ VI setup preset, read back live through
# `GameConfiguration` on the validation host rather than inferred from the
# `.Civ6Cfg` file on disk. See
# specs/002-civ-playing-harness/spikes/civsim-default-preset-linux.md and
# specs/002-civ-playing-harness/spikes/preset_readback.txt for the full
# session this was captured from.
schema_version: 1
name: civsim-default

# The preset itself does NOT carry a leader/civilization selection --
# civsim-default-preset-linux.md's live read-back found every player slot
# `civ=nil leader=nil human=false` after loading `CivSim DEFAULT`, and
# `HumanPlayerCount = 0`. The owner has resolved this: the harness selects
# these explicitly after loading the preset (see
# `run/preparation.py`'s leader-selection seam --
# `apply_and_verify_leader_selection`). Pinning them here is what lets V3
# (`check_seed_set_agreement`) catch a run configuration that disagrees with
# what the harness is actually supposed to select.
civilization: CIVILIZATION_PERSIA
leader: LEADER_CYRUS
ruleset: RULESET_EXPANSION_2

# 22 mods, pinned on id (+ version where the client reports one) -- never on
# the in-game title string. An empty list here would be a false pin: this
# host's preset genuinely loads with 22 mods active, and a seed set that
# claimed "no mods" would make V3's agreement check pass for a run
# configuration that in fact disagrees with every run this set actually
# produces, and would make V3 reject every *real* run against this host
# outright (its mod_set would never match an empty pin). `mod_set: []` is a
# meaningful, different claim ("no mods"), not a safe placeholder for "not
# yet catalogued".
#
# Titles are deliberately NOT recorded: one live title observed on this
# host is `[ENDCOLOR]TopPanel Extension [COLOR:ResGoldLabelCS]Pro[ENDCOLOR]`
# -- bracket-matched parsing of exactly this kind of string has already
# broken once (see the mod-title parsing note in the spikes). id + version
# is stable and unambiguous where a display title is neither.
#
# Versions (T251, read back live 2026-09-20 through the production getter --
# `Modding.GetModProperty(handle, "Version")`, since `GetActiveMods()`
# entries carry no Version field at all): only the three workshop mods report
# one. Every official Firaxis pack (expansions, DLC, persona packs) answers
# nil, so those are pinned on id only (`version: null`), which V2 records as
# accepted-unverified per mod rather than either fabricating a version or
# failing every run. The earlier `"v1"` on all 22 was a placeholder, not a
# measurement, and could never have matched.
#   - 619ac86e...  Multiplayer Helper 1.7.9   -> "179"
#   - c88cba8b...  Better Balanced Map 1.39.5 -> "1.39.5"
#   - cb84075d...  Better Balanced Game 7.5.0 -> "70500"
# Ids are lower-case here; the client reports them in MIXED case (workshop
# lower, official upper) and comparisons normalise on lower-case (T251).
mod_set:
  - { id: 02a8bdde-67ea-4d38-9540-26e685e3156e, version: null }  # Aztec / Montezuma
  - { id: 113d9459-0a3b-4fcb-a49c-483f40303575, version: null }  # Teddy Roosevelt Persona Pack
  - { id: 1b28771a-c749-434b-9053-d1380c553de9, version: null }  # Rise and Fall
  - { id: 1b394fe9-23dc-4868-8f0a-5220cb8fb427, version: null }  # Ethiopia Pack
  - { id: 1f367231-a040-4793-bdbb-088816853683, version: null }  # Indonesia / Khmer
  - { id: 2f6e858a-28ef-46b3-beac-b985e52e9bc1, version: null }  # Vikings Landmarks
  - { id: 3809975f-263f-40a2-a747-8bfb171d821a, version: null }  # Poland / Jadwiga
  - { id: 382a187f-c8ba-4094-a6a7-0d5315661f33, version: null }  # Extended Policy Cards
  - { id: 4873eb62-8ccc-4574-b784-dda455e74e68, version: null }  # Gathering Storm
  - { id: 619ac86e-d99d-4bf3-b8f0-8c5b8c402567, version: "179" }   # Multiplayer Helper 1.7.9
  - { id: 643ea320-8e1a-4cf1-a01c-00d88ddd131a, version: null }  # Nubia
  - { id: 8424840c-92ef-4426-a9b4-b4e0cb818049, version: null }  # Babylon Pack
  - { id: 9de86512-de1a-400d-8c0a-ab46ebbf76b9, version: null }  # Maya and Gran Colombia Pack
  - { id: 9e881f4f-017f-29f5-d849-04537424be3f, version: null }  # TopPanel Extension Pro
  - { id: a1100fc4-70f2-4129-ac27-2a65a685ed08, version: null }  # Byzantium and Gaul Pack
  - { id: a3f42cd4-6c3e-4f5a-bc81-be29e0c0b87c, version: null }  # Vietnam and Kublai Khan Pack
  - { id: ce5876cd-6900-46d1-9c9c-8dba1f28872e, version: null }  # Catherine de Medici Persona Pack
  - { id: e2749e9a-8056-45cd-901b-c368c8e83deb, version: null }  # Macedonia / Persia
  - { id: e3f53c61-371c-440b-96ce-077d318b36c0, version: null }  # Australia
