# Panel Registry freeze record -- rule P6 ("declarations are immutable within a
# version", contracts/panel-registry.md).
#
# Until this file existed, P6's second half was not in force: a declaration
# could be edited in place with nothing objecting. That was deliberate while
# Phases 3-6 authored the four YAML files concurrently -- freezing mid-authorship
# would have recorded build churn as schema history. Phases 3-6 are closed and
# the set is stable at 37 panels, all `introduced_in_version: "1"`, so version 1
# is frozen here.
#
# Read by `registry/loader.py::_validate_p6`. Each hash is
# `_hash(_declaration_payload(declaration))` -- sha256 over the declaration's
# canonical JSON with `declared_in` excluded, so relocating a panel between
# `live.yaml` and `shared.yaml` is inert but changing what it declares is not.
#
# **Adding, removing, or changing any declaration now means bumping
# `panels/VERSION` and adding that version's own block below.** Editing the
# hashes to match an edited declaration defeats the entire mechanism.
#
# `content_hash` is the registry-level digest (`PanelRegistry.content_hash`),
# recorded for human cross-reference; the loader compares the per-panel map.

